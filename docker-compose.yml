services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: genomic_platform
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      API_PASSWORD: ${API_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      INGEST_PASSWORD: ${INGEST_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: genomic-backend
    environment:
      DB_URL: jdbc:mysql://db:3306/genomic_platform?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: genomic_api
      DB_PASSWORD: ${API_PASSWORD}
      FLYWAY_USER: genomic_migrator
      FLYWAY_PASSWORD: ${MIGRATOR_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: genomic-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

  pipeline:
    build:
      context: ./data_pipeline/python
    image: genomic-pipeline
    profiles:
      - tools
    environment:
      INGEST_DB_HOST: db
      INGEST_DB_PORT: 3306
      INGEST_DB_USER: genomic_ingest
      INGEST_DB_PASSWORD: ${INGEST_PASSWORD}
      INGEST_DB_NAME: genomic_platform
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql_data: