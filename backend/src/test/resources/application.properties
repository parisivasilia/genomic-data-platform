spring.datasource.url=jdbc:h2:mem:genomic_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

# Non-production credentials used only for automated tests.
app.admin.username=test-admin
app.admin.password=test-password

# Test-only HMAC signing key.
app.jwt.secret=test-jwt-secret-for-automated-tests-32-bytes-minimum
app.jwt.ttl-seconds=3600