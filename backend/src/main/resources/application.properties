spring.application.name=Genomic Data Platform API

# Runtime database connection.
# Source genomic tables remain read-only to the application.
# Curated annotations receive narrowly scoped write privileges.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/genomic_platform}
spring.datasource.username=${DB_USER:genomic_api}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway uses a separate migration user with schema privileges.
spring.flyway.url=${DB_URL:jdbc:mysql://localhost:3307/genomic_platform}
spring.flyway.user=${FLYWAY_USER:genomic_migrator}
spring.flyway.password=${FLYWAY_PASSWORD:}

# Hibernate validates the schema and never creates or modifies it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Administrative authentication.
# Credentials and signing secret must be supplied through environment variables.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# JWT configuration.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}